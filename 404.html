<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Actividad | Impulso Tuaeméx</title>
  <script>
    (() => {
      const firstPathSegment = location.pathname.split('/').filter(Boolean)[0];
      const basePath = location.hostname.endsWith('.github.io') && firstPathSegment
        ? `/${encodeURIComponent(firstPathSegment)}/`
        : '/';
      const base = document.createElement('base');
      base.href = basePath;
      document.head.append(base);
    })();
  </script>
</head>
<body>
  <p id="route-status">Página no encontrada.</p>
  <a href="index.html">Volver a IMPULSO TUAEMÉX</a>
  <footer><a href="privacidad.html">Aviso de Privacidad</a></footer>
  <script type="module">
    // GitHub Pages no tiene rewrites. Solo estas rutas internas pasan a la vista única.
    import { nfcDestination } from './js/nfc-path.js?v=20260921-4';

    const prefix = new URL(document.baseURI).pathname;
    const path = location.pathname.startsWith(prefix)
      ? location.pathname.slice(prefix.length).replace(/\/$/, '')
      : '';
    const destination = nfcDestination(path, new URLSearchParams(location.search).get('t'));
    if (destination) {
      document.getElementById('route-status').textContent = 'Abriendo actividad…';
      location.replace(new URL(destination, document.baseURI));
    }
  </script>
</body>
</html>
